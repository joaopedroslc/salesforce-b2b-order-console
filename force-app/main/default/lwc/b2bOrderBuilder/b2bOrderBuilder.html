<template>
    <article class="slds-card slds-card_boundary">
        <div class="slds-card__header slds-grid card-header-centered">
            <header class="slds-media slds-media_center card-header-media">
                <div class="slds-media__figure">
                    <lightning-icon
                        icon-name="standard:orders"
                        size="small"
                        alternative-text="B2B Order Builder"
                    ></lightning-icon>
                </div>
                <div class="slds-media__body card-header-title-body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small" title="B2B Order Builder">
                            B2B Order Builder
                        </span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-m-bottom_small">
                <lightning-combobox
                    name="customerAccount"
                    label="B2B Customer Account"
                    placeholder="Select Customer Account..."
                    value={selectedAccountId}
                    options={accountOptions}
                    onchange={handleAccountChange}
                    required
                ></lightning-combobox>

                <template lwc:if={hasSelectedAccount}>
                    <div class="account-terms-strip slds-box slds-box_xx-small slds-theme_shade slds-m-top_xx-small">
                        <div class="account-terms-grid slds-text-body_small">
                            <span><lightning-icon icon-name="utility:check" size="xx-small" class="terms-check-icon"></lightning-icon><strong>Terms:</strong> Net 30</span>
                            <span><strong>Credit:</strong> Approved</span>
                            <span><strong>FOB:</strong> Destination</span>
                        </div>
                    </div>
                </template>
            </div>

            <template lwc:if={hasCartItems}>
                <div class="cart-header-row slds-m-bottom_x-small">
                    <span class="slds-text-title_caps slds-text-color_weak">
                        Order Line Items ({totalLineCount})
                    </span>
                    <button
                        type="button"
                        class="slds-button slds-button_neutral clear-cart-compact-btn"
                        onclick={handleClearCart}
                        disabled={isSubmitting}
                    >
                        <lightning-icon
                            icon-name="utility:clear"
                            size="xx-small"
                            class="clear-cart-icon"
                        ></lightning-icon>
                        <span>Clear Cart</span>
                    </button>
                </div>

                <div class="slds-scrollable_y cart-max-height slds-m-bottom_medium">
                    <template for:each={cartItems} for:item="line">
                        <c-b2b-order-line-item
                            key={line.inventoryId}
                            item={line}
                            onquantitychange={handleLineQuantityChange}
                            onremoveitem={handleRemoveLineItem}
                        ></c-b2b-order-line-item>
                    </template>
                </div>

                <div class="slds-m-bottom_medium">
                    <lightning-textarea
                        name="orderNotes"
                        label="Fulfillment / Delivery Instructions"
                        placeholder="Optional warehouse handling or dock instructions..."
                        value={orderNotes}
                        max-length="2000"
                        onchange={handleNotesChange}
                    ></lightning-textarea>
                </div>

                <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_medium financial-summary-card">
                    <div class="financial-line">
                        <span class="slds-text-body_small slds-text-color_weak">
                            Subtotal ({totalLineCount} SKUs / {totalUnitsCount} Units)
                        </span>
                        <span class="slds-text-body_small slds-text-title_bold">
                            <lightning-formatted-number
                                value={estimatedOrderTotal}
                                format-style="currency"
                                currency-code="USD"
                            ></lightning-formatted-number>
                        </span>
                    </div>

                    <div class="financial-line">
                        <span class="slds-text-body_small slds-text-color_weak">
                            Estimated Freight / Logistics
                        </span>
                        <span class="slds-text-body_small slds-text-color_success">
                            Complimentary ($0.00)
                        </span>
                    </div>

                    <div class="financial-line">
                        <span class="slds-text-body_small slds-text-color_weak">
                            Estimated Tax (B2B Certificate)
                        </span>
                        <span class="slds-text-body_small slds-text-color_weak">
                            Exempt ($0.00)
                        </span>
                    </div>

                    <div class="financial-line financial-line_total">
                        <span class="slds-text-title_caps slds-text-title_bold">
                            Total Order Value
                        </span>
                        <span class="slds-text-heading_small slds-text-title_bold total-highlight">
                            <lightning-formatted-number
                                value={estimatedOrderTotal}
                                format-style="currency"
                                currency-code="USD"
                            ></lightning-formatted-number>
                        </span>
                    </div>
                </div>

                <div class="builder-actions-grid">
                    <lightning-button
                        label="Save as Draft"
                        icon-name="utility:save"
                        stretch
                        onclick={handleSaveDraft}
                        disabled={isActionDisabled}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Submit Order to ERP"
                        icon-name="utility:send"
                        stretch
                        onclick={handleSubmitOrder}
                        disabled={isActionDisabled}
                    ></lightning-button>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-box slds-theme_shade slds-card_boundary slds-p-around_large slds-text-align_center">
                    <div class="slds-m-bottom_small">
                        <lightning-icon icon-name="standard:webcart" size="large" alternative-text="Empty Cart"></lightning-icon>
                    </div>
                    <h3 class="slds-text-heading_small slds-m-bottom_xx-small">Your B2B Order Cart is Empty</h3>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                        Select &ldquo;Add to Order&rdquo; on any product in the Warehouse Inventory Catalog to begin building an order.
                    </p>
                    <button
                        type="button"
                        class="slds-button slds-button_brand"
                        onclick={handleNavigateToCatalog}
                    >
                        <lightning-icon icon-name="utility:search" size="x-small" class="slds-button__icon slds-button__icon_left cart-cta-icon"></lightning-icon>
                        <span>Browse Warehouse Catalog</span>
                    </button>
                </div>
            </template>
        </div>
    </article>
</template>
