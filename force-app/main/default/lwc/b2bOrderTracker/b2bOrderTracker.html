<template>
    <lightning-card title="B2B Order &amp; ERP Fulfillment Monitor" icon-name="standard:fulfillment_order">
        <div slot="actions" class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small">
            <template lwc:if={empConnected}>
                <div class="slds-col">
                    <lightning-badge
                        label="Platform Event Auto-Sync Active"
                        icon-name="utility:broadcast"
                        class="slds-theme_success"
                    ></lightning-badge>
                </div>
            </template>
            <div class="slds-col">
                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={handleRefreshOrders}
                    disabled={isProcessing}
                ></lightning-button>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <template lwc:if={hasOrders}>
                <!-- DESKTOP & TABLET VIEW (>= 768px): High-Density SLDS Table -->
                <div class="slds-show_medium slds-scrollable_x">
                    <table
                        class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped"
                        aria-label="B2B Order and ERP Fulfillment Monitor"
                    >
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Order #">Order #</div></th>
                                <th scope="col"><div class="slds-truncate" title="Customer Account">Customer</div></th>
                                <th scope="col"><div class="slds-truncate" title="Items">Line Items</div></th>
                                <th scope="col"><div class="slds-truncate" title="Total Amount">Total Amount</div></th>
                                <th scope="col"><div class="slds-truncate" title="Order Status">Order Status</div></th>
                                <th scope="col"><div class="slds-truncate" title="ERP Sync / Ref">ERP Sync &amp; Ref</div></th>
                                <th scope="col"><div class="slds-truncate" title="Lifecycle Actions">Lifecycle Actions</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={orders} for:item="ord">
                                <tr key={ord.Id} class="slds-hint-parent">
                                    <th scope="row">
                                        <div class="slds-text-title_bold">{ord.Name}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            <lightning-formatted-date-time
                                                value={ord.CreatedDate}
                                                year="numeric"
                                                month="short"
                                                day="2-digit"
                                                hour="2-digit"
                                                minute="2-digit"
                                            ></lightning-formatted-date-time>
                                        </div>
                                    </th>
                                    <td>
                                        <div class="slds-truncate" title={ord.accountName}>{ord.accountName}</div>
                                    </td>
                                    <td>
                                        <div class="slds-text-body_small">
                                            <span class="slds-text-title_bold">{ord.Total_Items__c}</span> item(s)
                                        </div>
                                        <template lwc:if={ord.hasLineItems}>
                                            <div class="slds-text-body_small slds-text-color_weak">
                                                <template for:each={ord.lineItems} for:item="li">
                                                    <div key={li.Id}>
                                                        {li.Quantity__c}x {li.productName}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </td>
                                    <td>
                                        <span class="slds-text-title_bold">
                                            <lightning-formatted-number
                                                value={ord.Total_Amount__c}
                                                format-style="currency"
                                                currency-code="USD"
                                            ></lightning-formatted-number>
                                        </span>
                                    </td>
                                    <td>
                                        <span class={ord.statusBadgeClass}>{ord.Status__c}</span>
                                    </td>
                                    <td>
                                        <div class="slds-text-title_bold">{ord.erpRefDisplay}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {ord.syncStatusDisplay}
                                        </div>
                                    </td>
                                    <td>
                                        <lightning-button-group>
                                            <template lwc:if={ord.canSubmit}>
                                                <lightning-button
                                                    label="Submit to ERP"
                                                    variant="brand"
                                                    data-id={ord.Id}
                                                    data-status="Submitted"
                                                    onclick={handleStatusAction}
                                                    disabled={isProcessing}
                                                ></lightning-button>
                                            </template>
                                            <template lwc:if={ord.canShip}>
                                                <lightning-button
                                                    label="Mark Shipped"
                                                    variant="success"
                                                    data-id={ord.Id}
                                                    data-status="Shipped"
                                                    onclick={handleStatusAction}
                                                    disabled={isProcessing}
                                                ></lightning-button>
                                            </template>
                                            <template lwc:if={ord.canCancel}>
                                                <lightning-button
                                                    label="Cancel"
                                                    variant="destructive-text"
                                                    data-id={ord.Id}
                                                    data-status="Cancelled"
                                                    onclick={handleStatusAction}
                                                    disabled={isProcessing}
                                                ></lightning-button>
                                            </template>
                                        </lightning-button-group>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- MOBILE VIEW (< 768px): Touch-Optimized SLDS Order Fulfillment Cards -->
                <div class="slds-hide_medium">
                    <template for:each={orders} for:item="ord">
                        <article
                            key={ord.Id}
                            class="slds-box slds-box_x-small slds-theme_default slds-m-bottom_small"
                        >
                            <!-- Mobile Order Header -->
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start slds-m-bottom_x-small">
                                <div class="slds-col slds-has-flexi-truncate slds-p-right_x-small">
                                    <div class="slds-text-title_bold">{ord.Name} &bull; {ord.accountName}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">
                                        <lightning-formatted-date-time
                                            value={ord.CreatedDate}
                                            year="numeric"
                                            month="short"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit"
                                        ></lightning-formatted-date-time>
                                    </div>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <span class={ord.statusBadgeClass}>{ord.Status__c}</span>
                                </div>
                            </div>

                            <!-- Mobile Order Metrics Strip -->
                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_x-small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div>
                                        <div class="slds-text-body_small slds-text-color_weak">ERP Sync / Ref</div>
                                        <div class="slds-text-title_bold">{ord.erpRefDisplay}</div>
                                        <div class="slds-text-body_small slds-text-color_weak">{ord.syncStatusDisplay}</div>
                                    </div>
                                    <div class="slds-text-align_right">
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {ord.Total_Items__c} item(s)
                                        </div>
                                        <div class="slds-text-heading_small slds-text-title_bold">
                                            <lightning-formatted-number
                                                value={ord.Total_Amount__c}
                                                format-style="currency"
                                                currency-code="USD"
                                            ></lightning-formatted-number>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Line Items Summary -->
                            <template lwc:if={ord.hasLineItems}>
                                <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                    <template for:each={ord.lineItems} for:item="li">
                                        <div key={li.Id}>{li.Quantity__c}x {li.productName}</div>
                                    </template>
                                </div>
                            </template>

                            <!-- Mobile Lifecycle Actions -->
                            <div class="slds-grid slds-grid_align-end">
                                <lightning-button-group>
                                    <template lwc:if={ord.canSubmit}>
                                        <lightning-button
                                            label="Submit to ERP"
                                            variant="brand"
                                            data-id={ord.Id}
                                            data-status="Submitted"
                                            onclick={handleStatusAction}
                                            disabled={isProcessing}
                                        ></lightning-button>
                                    </template>
                                    <template lwc:if={ord.canShip}>
                                        <lightning-button
                                            label="Mark Shipped"
                                            variant="success"
                                            data-id={ord.Id}
                                            data-status="Shipped"
                                            onclick={handleStatusAction}
                                            disabled={isProcessing}
                                        ></lightning-button>
                                    </template>
                                    <template lwc:if={ord.canCancel}>
                                        <lightning-button
                                            label="Cancel"
                                            variant="destructive-text"
                                            data-id={ord.Id}
                                            data-status="Cancelled"
                                            onclick={handleStatusAction}
                                            disabled={isProcessing}
                                        ></lightning-button>
                                    </template>
                                </lightning-button-group>
                            </div>
                        </article>
                    </template>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-box slds-theme_shade slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:fulfillment_order" size="medium" class="slds-m-bottom_small"></lightning-icon>
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">No B2B Orders Yet</h3>
                    <p class="slds-text-color_weak">
                        Orders created or submitted in the Order Builder will appear here with real-time Platform Event status updates.
                    </p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
