<template>
    <lightning-card title="B2B Inventory Catalog" icon-name="standard:product">
        <div slot="actions" class="desktop-only-view">
            <lightning-button-group>
                <lightning-button
                    label="Seed Demo Data"
                    icon-name="utility:database"
                    onclick={handleSeedCatalog}
                    disabled={isSyncing}
                ></lightning-button>
                <lightning-button
                    variant="brand"
                    label="Sync with ERP"
                    icon-name="utility:sync"
                    onclick={handleSyncErp}
                    disabled={isSyncing}
                ></lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-card__body slds-card__body_inner catalog-body">
            <div class="mobile-only-view mobile-action-toolbar slds-m-bottom_small">
                <lightning-button
                    label="Seed Data"
                    icon-name="utility:database"
                    stretch
                    onclick={handleSeedCatalog}
                    disabled={isSyncing}
                ></lightning-button>
                <lightning-button
                    variant="brand"
                    label="ERP Sync"
                    icon-name="utility:sync"
                    stretch
                    onclick={handleSyncErp}
                    disabled={isSyncing}
                ></lightning-button>
            </div>

            <div class="kpi-grid slds-m-bottom_small">
                <div class="slds-box slds-box_x-small slds-theme_shade slds-card_boundary kpi-card">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure desktop-only-view">
                            <lightning-icon
                                icon-name="standard:product_item"
                                size="small"
                                alternative-text="Active SKUs"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body kpi-media-body">
                            <p class="kpi-label slds-text-color_weak">SKUs</p>
                            <p class="slds-text-heading_small slds-text-title_bold">{totalSkus}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-box slds-box_x-small slds-theme_shade slds-card_boundary kpi-card">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure desktop-only-view">
                            <lightning-icon
                                icon-name="standard:fulfillment_order"
                                size="small"
                                alternative-text="Available Units"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body kpi-media-body">
                            <p class="kpi-label slds-text-color_weak">Available</p>
                            <p class="slds-text-heading_small slds-text-title_bold">{totalAvailableUnits}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-box slds-box_x-small slds-theme_shade slds-card_boundary kpi-card">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure desktop-only-view">
                            <lightning-icon
                                icon-name="standard:incident"
                                size="small"
                                alternative-text="Low or Out of Stock Alerts"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body kpi-media-body">
                            <p class="kpi-label slds-text-color_weak">Alerts</p>
                            <p class="slds-text-heading_small slds-text-title_bold slds-text-color_error">
                                {lowOrOutCount}
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-grid slds-m-bottom_small">
                <div>
                    <lightning-input
                        type="search"
                        label="Search Catalog"
                        variant="label-hidden"
                        placeholder="Search by Product, Code, or SKU..."
                        onchange={handleSearchChange}
                    ></lightning-input>
                </div>
                <div>
                    <lightning-combobox
                        name="stockStatus"
                        label="Filter Stock Status"
                        variant="label-hidden"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}
                    ></lightning-combobox>
                </div>
            </div>

            <template lwc:if={isLoading}>
                <div role="status" aria-label="Loading inventory catalog">
                    <div class="slds-box slds-box_x-small slds-m-bottom_x-small skeleton-stencil"></div>
                    <div class="slds-box slds-box_x-small slds-m-bottom_x-small skeleton-stencil"></div>
                    <div class="slds-box slds-box_x-small skeleton-stencil"></div>
                </div>
            </template>

            <template lwc:elseif={hasInventoryItems}>
                <div class="desktop-only-view slds-scrollable_y catalog-max-height">
                    <table
                        class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-table_col-bordered"
                        aria-label="B2B Warehouse Inventory Catalog"
                    >
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Product &amp; SKU">Product / SKU</div></th>
                                <th scope="col"><div class="slds-truncate" title="Unit Price">Unit Price</div></th>
                                <th scope="col"><div class="slds-truncate" title="On Hand">On Hand</div></th>
                                <th scope="col"><div class="slds-truncate" title="Reserved">Reserved</div></th>
                                <th scope="col"><div class="slds-truncate" title="Available">Available</div></th>
                                <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                <th scope="col"><div class="slds-truncate" title="Action">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={inventoryItems} for:item="item">
                                <tr key={item.Id} class="slds-hint-parent">
                                    <th scope="row">
                                        <div class="slds-text-title_bold slds-truncate" title={item.productName}>
                                            {item.productName}
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {item.External_SKU__c} &bull; {item.productFamily}
                                        </div>
                                    </th>
                                    <td>
                                        <lightning-formatted-number
                                            value={item.Unit_Price__c}
                                            format-style="currency"
                                            currency-code="USD"
                                        ></lightning-formatted-number>
                                    </td>
                                    <td>{item.On_Hand_Quantity__c}</td>
                                    <td>{item.Reserved_Quantity__c}</td>
                                    <td>
                                        <span class="slds-text-title_bold">{item.Available_Quantity__c}</span>
                                    </td>
                                    <td>
                                        <span class={item.sldsBadgeClass}>{item.Stock_Status__c}</span>
                                    </td>
                                    <td>
                                        <lightning-button
                                            label="Add to Order"
                                            icon-name="utility:add"
                                            variant="neutral"
                                            data-id={item.Id}
                                            onclick={handleAddToOrder}
                                            disabled={item.isOutOfStock}
                                        ></lightning-button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="mobile-only-view">
                    <template for:each={inventoryItems} for:item="item">
                        <article
                            key={item.Id}
                            class="slds-box slds-box_x-small slds-theme_default slds-card_boundary slds-m-bottom_small mobile-product-card"
                        >
                            <div class="card-top-row slds-m-bottom_xx-small">
                                <span class="slds-badge slds-badge_lightest">{item.External_SKU__c}</span>
                                <span class={item.sldsBadgeClass}>{item.Stock_Status__c}</span>
                            </div>

                            <div class="slds-m-bottom_x-small">
                                <h3 class="slds-text-title_bold product-card-title">
                                    {item.productName}
                                </h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    {item.productFamily}
                                </p>
                            </div>

                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_x-small">
                                <div class="card-metrics-grid slds-text-align_center">
                                    <div class="metric-cell">
                                        <div class="metric-caption slds-text-color_weak">Unit Price</div>
                                        <div class="slds-text-title_bold">
                                            <lightning-formatted-number
                                                value={item.Unit_Price__c}
                                                format-style="currency"
                                                currency-code="USD"
                                            ></lightning-formatted-number>
                                        </div>
                                    </div>
                                    <div class="metric-cell slds-border_left slds-border_right">
                                        <div class="metric-caption slds-text-color_weak">OH / Res</div>
                                        <div class="slds-text-body_regular metric-nowrap">
                                            {item.On_Hand_Quantity__c} / {item.Reserved_Quantity__c}
                                        </div>
                                    </div>
                                    <div class="metric-cell">
                                        <div class="metric-caption slds-text-color_weak">Available</div>
                                        <div class="slds-text-title_bold">{item.Available_Quantity__c}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="full-width-cta">
                                <lightning-button
                                    label="Add to Order"
                                    icon-name="utility:add"
                                    variant="brand"
                                    stretch
                                    data-id={item.Id}
                                    onclick={handleAddToOrder}
                                    disabled={item.isOutOfStock}
                                ></lightning-button>
                            </div>
                        </article>
                    </template>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-box slds-theme_shade slds-card_boundary slds-p-around_large slds-text-align_center">
                    <div class="slds-m-bottom_small">
                        <lightning-icon icon-name="standard:product" size="large" alternative-text="No Catalog Inventory"></lightning-icon>
                    </div>
                    <h3 class="slds-text-heading_small slds-m-bottom_xx-small">No Catalog Inventory Found</h3>
                    <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                        Click &ldquo;Seed Demo Data&rdquo; to populate sample B2B Accounts, Products, and Warehouse Stock.
                    </p>
                    <lightning-button
                        variant="brand"
                        label="Seed Sample B2B Catalog"
                        icon-name="utility:database"
                        onclick={handleSeedCatalog}
                        disabled={isSyncing}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
