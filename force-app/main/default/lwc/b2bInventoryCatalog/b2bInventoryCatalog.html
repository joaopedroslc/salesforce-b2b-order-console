<template>
    <lightning-card title="B2B Inventory Catalog" icon-name="standard:product">
        <div slot="actions">
            <!-- Desktop Full Action Buttons -->
            <div class="slds-show_medium">
                <lightning-button-group>
                    <lightning-button
                        label="Seed Demo Data"
                        icon-name="utility:database"
                        onclick={handleSeedCatalog}
                        disabled={isSyncing}
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Sync with ERP"
                        icon-name="utility:sync"
                        onclick={handleSyncErp}
                        disabled={isSyncing}
                    ></lightning-button>
                </lightning-button-group>
            </div>
            <!-- Mobile Compact Action Buttons (Prevents horizontal overflow on narrow phones) -->
            <div class="slds-hide_medium">
                <div class="slds-button-group" role="group">
                    <lightning-button-icon
                        icon-name="utility:database"
                        variant="border-filled"
                        alternative-text="Seed Demo Data"
                        title="Seed Demo Data"
                        onclick={handleSeedCatalog}
                        disabled={isSyncing}
                    ></lightning-button-icon>
                    <lightning-button
                        variant="brand"
                        label="ERP Sync"
                        icon-name="utility:sync"
                        onclick={handleSyncErp}
                        disabled={isSyncing}
                    ></lightning-button>
                </div>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner">
            <!-- Native SLDS KPI Summary Strip (Responsive Mobile + Desktop) -->
            <div class="slds-grid slds-wrap slds-gutters_xx-small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center">
                        <p class="slds-text-title_caps slds-text-color_weak slds-truncate" title="Active SKUs">
                            SKUs
                        </p>
                        <p class="slds-text-heading_small slds-text-title_bold">{totalSkus}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center">
                        <p class="slds-text-title_caps slds-text-color_weak slds-truncate" title="Available Units">
                            Available
                        </p>
                        <p class="slds-text-heading_small slds-text-title_bold">{totalAvailableUnits}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-3">
                    <div class="slds-box slds-box_x-small slds-theme_shade slds-text-align_center">
                        <p class="slds-text-title_caps slds-text-color_weak slds-truncate" title="Low / Out Alerts">
                            Alerts
                        </p>
                        <p class="slds-text-heading_small slds-text-title_bold slds-text-color_error">
                            {lowOrOutCount}
                        </p>
                    </div>
                </div>
            </div>

            <!-- SLDS Search & Filter Grid (Stacks cleanly on Mobile) -->
            <div class="slds-grid slds-wrap slds-gutters_x-small slds-m-bottom_small">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12 slds-m-bottom_x-small">
                    <lightning-input
                        type="search"
                        label="Search Catalog"
                        variant="label-hidden"
                        placeholder="Search by Product Name, Code, or External SKU..."
                        onchange={handleSearchChange}
                    ></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 slds-m-bottom_x-small">
                    <lightning-combobox
                        name="stockStatus"
                        label="Filter Stock Status"
                        variant="label-hidden"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}
                    ></lightning-combobox>
                </div>
            </div>

            <!-- SLDS Stencil / Loading Skeleton -->
            <template lwc:if={isLoading}>
                <div role="status" aria-label="Loading inventory catalog">
                    <div class="slds-box slds-box_x-small slds-m-bottom_x-small skeleton-stencil"></div>
                    <div class="slds-box slds-box_x-small slds-m-bottom_x-small skeleton-stencil"></div>
                    <div class="slds-box slds-box_x-small skeleton-stencil"></div>
                </div>
            </template>

            <template lwc:elseif={hasInventoryItems}>
                <!-- DESKTOP & TABLET VIEW (>= 768px): High-Density SLDS Data Table -->
                <div class="slds-show_medium slds-scrollable_y catalog-max-height">
                    <table
                        class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-table_col-bordered"
                        aria-label="B2B Warehouse Inventory Catalog"
                    >
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Product &amp; SKU">Product / SKU</div></th>
                                <th scope="col"><div class="slds-truncate" title="Unit Price">Unit Price</div></th>
                                <th scope="col"><div class="slds-truncate" title="On Hand">On Hand</div></th>
                                <th scope="col"><div class="slds-truncate" title="Reserved">Reserved</div></th>
                                <th scope="col"><div class="slds-truncate" title="Available">Available</div></th>
                                <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                <th scope="col"><div class="slds-truncate" title="Action">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={inventoryItems} for:item="item">
                                <tr key={item.Id} class="slds-hint-parent">
                                    <th scope="row">
                                        <div class="slds-text-title_bold slds-truncate" title={item.productName}>
                                            {item.productName}
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak">
                                            {item.External_SKU__c} &bull; {item.productFamily}
                                        </div>
                                    </th>
                                    <td>
                                        <lightning-formatted-number
                                            value={item.Unit_Price__c}
                                            format-style="currency"
                                            currency-code="USD"
                                        ></lightning-formatted-number>
                                    </td>
                                    <td>{item.On_Hand_Quantity__c}</td>
                                    <td>{item.Reserved_Quantity__c}</td>
                                    <td>
                                        <span class="slds-text-title_bold">{item.Available_Quantity__c}</span>
                                    </td>
                                    <td>
                                        <span class={item.sldsBadgeClass}>{item.Stock_Status__c}</span>
                                    </td>
                                    <td>
                                        <lightning-button
                                            label="Add to Order"
                                            icon-name="utility:add"
                                            variant="neutral"
                                            data-id={item.Id}
                                            onclick={handleAddToOrder}
                                            disabled={item.isOutOfStock}
                                        ></lightning-button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- MOBILE VIEW (< 768px): Touch-Optimized SLDS Product Cards -->
                <div class="slds-hide_medium">
                    <template for:each={inventoryItems} for:item="item">
                        <article
                            key={item.Id}
                            class="slds-box slds-box_x-small slds-theme_default slds-m-bottom_small"
                        >
                            <!-- Top Row: SKU Badge + Stock Status Badge -->
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                <span class="slds-badge slds-badge_lightest">{item.External_SKU__c}</span>
                                <span class={item.sldsBadgeClass}>{item.Stock_Status__c}</span>
                            </div>

                            <!-- Full-Width Product Title & Family -->
                            <div class="slds-m-bottom_x-small">
                                <h3 class="slds-text-title_bold" title={item.productName}>
                                    {item.productName}
                                </h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    {item.productFamily}
                                </p>
                            </div>

                            <!-- Card Metrics Strip: Unit Price | On Hand / Reserved | Available -->
                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_x-small">
                                <div class="slds-grid slds-text-align_center">
                                    <div class="slds-col slds-size_1-of-3">
                                        <div class="slds-text-body_small slds-text-color_weak">Unit Price</div>
                                        <div class="slds-text-title_bold">
                                            <lightning-formatted-number
                                                value={item.Unit_Price__c}
                                                format-style="currency"
                                                currency-code="USD"
                                            ></lightning-formatted-number>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3 slds-border_left slds-border_right">
                                        <div class="slds-text-body_small slds-text-color_weak">On Hand / Res</div>
                                        <div class="slds-text-body_regular">
                                            {item.On_Hand_Quantity__c} / {item.Reserved_Quantity__c}
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <div class="slds-text-body_small slds-text-color_weak">Available</div>
                                        <div class="slds-text-title_bold">{item.Available_Quantity__c}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Touch-Friendly Action Row -->
                            <div class="slds-grid slds-grid_align-end">
                                <lightning-button
                                    label="Add to Order"
                                    icon-name="utility:add"
                                    variant="brand"
                                    stretch
                                    data-id={item.Id}
                                    onclick={handleAddToOrder}
                                    disabled={item.isOutOfStock}
                                ></lightning-button>
                            </div>
                        </article>
                    </template>
                </div>
            </template>

            <!-- SLDS Empty State Box -->
            <template lwc:else>
                <div class="slds-box slds-theme_shade slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:package_org" size="medium" class="slds-m-bottom_small"></lightning-icon>
                    <h3 class="slds-text-heading_small slds-m-bottom_x-small">No Catalog Inventory Found</h3>
                    <p class="slds-text-color_weak slds-m-bottom_medium">
                        Click &ldquo;Seed Demo Data&rdquo; to populate sample B2B Accounts, Products, and Warehouse Stock.
                    </p>
                    <lightning-button
                        variant="brand"
                        label="Seed Sample B2B Catalog"
                        icon-name="utility:database"
                        onclick={handleSeedCatalog}
                        disabled={isSyncing}
                    ></lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
