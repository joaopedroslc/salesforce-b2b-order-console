<template>
    <article class="slds-card slds-card_boundary catalog-card">
        <div class="slds-card__header slds-grid card-header-centered">
            <header class="slds-media slds-media_center card-header-media">
                <div class="slds-media__figure">
                    <lightning-icon
                        icon-name="standard:product"
                        size="small"
                        alternative-text="B2B Inventory Catalog"
                    ></lightning-icon>
                </div>
                <div class="slds-media__body card-header-title-body">
                    <h2 class="slds-card__header-title">
                        <span class="slds-text-heading_small" title="B2B Inventory Catalog">
                            B2B Inventory Catalog
                        </span>
                    </h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-card__body_inner catalog-body">
            <div class="action-toolbar slds-m-bottom_small">
                <button
                    type="button"
                    class="slds-button slds-button_neutral toolbar-compact-btn"
                    onclick={handleSeedCatalog}
                    disabled={isSyncing}
                >
                    <lightning-icon
                        icon-name="utility:database"
                        size="xx-small"
                        class="toolbar-btn-icon"
                    ></lightning-icon>
                    <span>Seed Data</span>
                </button>
                <button
                    type="button"
                    class="slds-button slds-button_brand toolbar-compact-btn toolbar-compact-btn_brand"
                    onclick={handleSyncErp}
                    disabled={isSyncing}
                >
                    <lightning-icon
                        icon-name="utility:sync"
                        size="xx-small"
                        class="toolbar-btn-icon"
                    ></lightning-icon>
                    <span>ERP Sync</span>
                </button>
            </div>

            <div class="kpi-grid slds-m-bottom_small" role="toolbar" aria-label="Quick Stock Filters">
                <div
                    class={kpiAllClass}
                    role="button"
                    tabindex="0"
                    title="View All SKUs"
                    data-filter="all"
                    onclick={handleKpiClick}
                    onkeydown={handleKpiKeyDown}
                >
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure desktop-only-view">
                            <lightning-icon
                                icon-name="standard:product_item"
                                size="small"
                                alternative-text="Active SKUs"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body kpi-media-body">
                            <p class="kpi-label slds-text-color_weak">SKUs</p>
                            <p class="slds-text-heading_small slds-text-title_bold">{totalSkus}</p>
                        </div>
                    </div>
                </div>
                <div class="slds-box slds-box_x-small slds-theme_shade slds-card_boundary kpi-card">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure desktop-only-view">
                            <lightning-icon
                                icon-name="standard:fulfillment_order"
                                size="small"
                                alternative-text="Available Units"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body kpi-media-body">
                            <p class="kpi-label slds-text-color_weak">Available</p>
                            <p class="slds-text-heading_small slds-text-title_bold">{totalAvailableUnits}</p>
                        </div>
                    </div>
                </div>
                <div
                    class={kpiAlertsClass}
                    role="button"
                    tabindex="0"
                    title="Filter by Alerts (Low or Out of Stock)"
                    data-filter="alerts"
                    onclick={handleKpiClick}
                    onkeydown={handleKpiKeyDown}
                >
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure desktop-only-view">
                            <lightning-icon
                                icon-name="standard:incident"
                                size="small"
                                alternative-text="Low or Out of Stock Alerts"
                            ></lightning-icon>
                        </div>
                        <div class="slds-media__body kpi-media-body">
                            <p class="kpi-label slds-text-color_weak">Alerts</p>
                            <p class="slds-text-heading_small slds-text-title_bold slds-text-color_error">
                                {lowOrOutCount}
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="filter-grid slds-m-bottom_small">
                <div class="filter-col">
                    <lightning-input
                        type="search"
                        label="Search Catalog"
                        variant="label-hidden"
                        placeholder="Search Product, Code, SKU..."
                        value={searchTerm}
                        onchange={handleSearchChange}
                    ></lightning-input>
                </div>
                <div class="filter-col">
                    <lightning-combobox
                        name="stockStatus"
                        label="Filter Stock Status"
                        variant="label-hidden"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}
                    ></lightning-combobox>
                </div>
                <div class="filter-col">
                    <lightning-combobox
                        name="catalogSort"
                        label="Sort Catalog By"
                        variant="label-hidden"
                        value={selectedSort}
                        options={sortOptions}
                        onchange={handleSortChange}
                    ></lightning-combobox>
                </div>
            </div>

            <template lwc:if={showFilterPills}>
                <div class="active-filter-strip slds-m-bottom_small">
                    <span class="slds-text-body_small slds-text-color_weak slds-m-right_xx-small">Filters:</span>
                    <template lwc:if={hasSearchTerm}>
                        <span class="slds-pill slds-m-right_xx-small">
                            <span class="slds-pill__label">&ldquo;{searchTerm}&rdquo;</span>
                            <button
                                type="button"
                                class="slds-button slds-button_icon slds-pill__remove"
                                title="Remove Search Filter"
                                onclick={handleClearSearch}
                            >
                                <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Remove"></lightning-icon>
                            </button>
                        </span>
                    </template>
                    <template lwc:if={hasStatusFilter}>
                        <span class="slds-pill slds-m-right_xx-small">
                            <span class="slds-pill__label">{selectedStatus}</span>
                            <button
                                type="button"
                                class="slds-button slds-button_icon slds-pill__remove"
                                title="Remove Status Filter"
                                onclick={handleClearStatus}
                            >
                                <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Remove"></lightning-icon>
                            </button>
                        </span>
                    </template>
                    <button
                        type="button"
                        class="slds-button slds-button_destructive-text clear-all-btn"
                        onclick={handleResetFilters}
                    >
                        Reset All
                    </button>
                </div>
            </template>

            <template lwc:if={isLoading}>
                <div role="status" aria-label="Loading inventory catalog">
                    <div class="slds-box slds-box_x-small slds-m-bottom_x-small skeleton-stencil"></div>
                    <div class="slds-box slds-box_x-small slds-m-bottom_x-small skeleton-stencil"></div>
                    <div class="slds-box slds-box_x-small skeleton-stencil"></div>
                </div>
            </template>

            <template lwc:elseif={hasInventoryItems}>
                <div class="desktop-only-view slds-scrollable_y catalog-table-container">
                    <table
                        class="slds-table slds-table_compact slds-table_cell-buffer slds-table_bordered slds-table_striped slds-table_col-bordered catalog-table"
                        aria-label="B2B Warehouse Inventory Catalog"
                    >
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Product &amp; SKU">Product / SKU</div></th>
                                <th scope="col"><div class="slds-truncate" title="Unit Price">Unit Price</div></th>
                                <th scope="col"><div class="slds-truncate" title="On Hand">On Hand</div></th>
                                <th scope="col"><div class="slds-truncate" title="Reserved">Reserved</div></th>
                                <th scope="col"><div class="slds-truncate" title="Available">Available</div></th>
                                <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                <th scope="col"><div class="slds-truncate" title="Action">Action</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={paginatedInventoryItems} for:item="item">
                                <tr key={item.Id} class="slds-hint-parent">
                                    <th scope="row">
                                        <div class="slds-text-title_bold slds-truncate product-title" title={item.productName}>
                                            {item.productName}
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak product-subtitle">
                                            {item.External_SKU__c} &bull; {item.productFamily}
                                        </div>
                                    </th>
                                    <td>
                                        <lightning-formatted-number
                                            value={item.Unit_Price__c}
                                            format-style="currency"
                                            currency-code="USD"
                                        ></lightning-formatted-number>
                                    </td>
                                    <td>{item.On_Hand_Quantity__c}</td>
                                    <td>{item.Reserved_Quantity__c}</td>
                                    <td>
                                        <span class="slds-text-title_bold">{item.Available_Quantity__c}</span>
                                    </td>
                                    <td>
                                        <span class={item.sldsBadgeClass}>{item.Stock_Status__c}</span>
                                    </td>
                                    <td>
                                        <template lwc:if={item.isOutOfStock}>
                                            <button
                                                type="button"
                                                class="slds-button slds-button_neutral action-backorder-btn catalog-action-btn"
                                                disabled
                                                title="Zero stock available - backorder required"
                                            >
                                                <lightning-icon icon-name="utility:clock" size="xx-small" class="slds-m-right_xx-small action-btn-icon"></lightning-icon>
                                                <span>Backorder</span>
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <button
                                                type="button"
                                                class="slds-button slds-button_neutral catalog-action-btn"
                                                data-id={item.Id}
                                                onclick={handleAddToOrder}
                                            >
                                                <lightning-icon icon-name="utility:add" size="xx-small" class="slds-m-right_xx-small action-btn-icon"></lightning-icon>
                                                <span>Add to Order</span>
                                            </button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <div class="mobile-only-view">
                    <template for:each={paginatedInventoryItems} for:item="item">
                        <article
                            key={item.Id}
                            class="slds-box slds-box_x-small slds-theme_default slds-card_boundary slds-m-bottom_small mobile-product-card"
                        >
                            <div class="card-top-row slds-m-bottom_xx-small">
                                <span class="slds-badge slds-badge_lightest">{item.External_SKU__c}</span>
                                <span class={item.sldsBadgeClass}>{item.Stock_Status__c}</span>
                            </div>

                            <div class="slds-m-bottom_x-small">
                                <h3 class="slds-text-title_bold product-card-title">
                                    {item.productName}
                                </h3>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    {item.productFamily}
                                </p>
                            </div>

                            <div class="slds-box slds-box_xx-small slds-theme_shade slds-m-bottom_x-small">
                                <div class="card-metrics-grid slds-text-align_center">
                                    <div class="metric-cell">
                                        <div class="metric-caption slds-text-color_weak">Unit Price</div>
                                        <div class="slds-text-title_bold">
                                            <lightning-formatted-number
                                                value={item.Unit_Price__c}
                                                format-style="currency"
                                                currency-code="USD"
                                            ></lightning-formatted-number>
                                        </div>
                                    </div>
                                    <div class="metric-cell slds-border_left slds-border_right">
                                        <div class="metric-caption slds-text-color_weak">On Hand / Rsvd</div>
                                        <div class="slds-text-body_regular metric-nowrap">
                                            {item.On_Hand_Quantity__c} / {item.Reserved_Quantity__c}
                                        </div>
                                    </div>
                                    <div class="metric-cell">
                                        <div class="metric-caption slds-text-color_weak">Available</div>
                                        <div class="slds-text-title_bold">{item.Available_Quantity__c}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="full-width-cta">
                                <template lwc:if={item.isOutOfStock}>
                                    <button
                                        type="button"
                                        class="slds-button slds-button_neutral out-of-stock-btn"
                                        disabled
                                    >
                                        <lightning-icon icon-name="utility:clock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        <span>Out of Stock (Backorder)</span>
                                    </button>
                                </template>
                                <template lwc:else>
                                    <lightning-button
                                        label="Add to Order"
                                        icon-name="utility:add"
                                        variant="brand"
                                        stretch
                                        data-id={item.Id}
                                        onclick={handleAddToOrder}
                                    ></lightning-button>
                                </template>
                            </div>
                        </article>
                    </template>
                </div>

                <div class="pagination-bar slds-m-top_small slds-p-horizontal_xx-small">
                    <div class="pagination-summary slds-text-body_small slds-text-color_weak">
                        {paginationSummary}
                    </div>
                    <div class="pagination-controls">
                        <button
                            type="button"
                            class="slds-button slds-button_icon slds-button_icon-border-filled pagination-nav-btn"
                            title="Previous Page"
                            disabled={isFirstPage}
                            onclick={handlePreviousPage}
                        >
                            <lightning-icon icon-name="utility:chevronleft" size="xx-small" alternative-text="Previous Page"></lightning-icon>
                        </button>
                        <span class="slds-text-body_small slds-p-horizontal_x-small page-indicator">
                            Page <strong>{currentPage}</strong> of <strong>{totalPages}</strong>
                        </span>
                        <button
                            type="button"
                            class="slds-button slds-button_icon slds-button_icon-border-filled pagination-nav-btn"
                            title="Next Page"
                            disabled={isLastPage}
                            onclick={handleNextPage}
                        >
                            <lightning-icon icon-name="utility:chevronright" size="xx-small" alternative-text="Next Page"></lightning-icon>
                        </button>
                    </div>
                    <div class="pagination-size-select">
                        <lightning-combobox
                            name="pageSize"
                            label="Page Size"
                            variant="label-hidden"
                            value={pageSizeValue}
                            options={pageSizeOptions}
                            onchange={handlePageSizeChange}
                        ></lightning-combobox>
                    </div>
                </div>
            </template>

            <template lwc:else>
                <template lwc:if={isDatabaseEmpty}>
                    <div class="slds-box slds-theme_shade slds-card_boundary slds-p-around_large slds-text-align_center catalog-empty-state">
                        <div class="slds-m-bottom_small">
                            <lightning-icon icon-name="standard:product" size="large" alternative-text="No Catalog Inventory"></lightning-icon>
                        </div>
                        <h3 class="slds-text-heading_small slds-m-bottom_xx-small">No Catalog Inventory Found</h3>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                            Click &ldquo;Seed Data&rdquo; to populate sample B2B Accounts, Products, and Warehouse Stock.
                        </p>
                        <button
                            type="button"
                            class="slds-button slds-button_brand"
                            onclick={handleSeedCatalog}
                            disabled={isSyncing}
                        >
                            <lightning-icon icon-name="utility:database" size="x-small" class="slds-button__icon slds-button__icon_left seed-cta-icon"></lightning-icon>
                            <span>Seed Sample B2B Catalog</span>
                        </button>
                    </div>
                </template>
                <template lwc:else>
                    <div class="slds-box slds-theme_shade slds-card_boundary slds-p-around_large slds-text-align_center catalog-empty-state">
                        <div class="slds-m-bottom_small">
                            <lightning-icon icon-name="utility:search" size="large" alternative-text="No Matching Products"></lightning-icon>
                        </div>
                        <h3 class="slds-text-heading_small slds-m-bottom_xx-small">No Matching Products Found</h3>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                            No warehouse inventory matches your active search or stock filters.
                        </p>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral"
                            onclick={handleResetFilters}
                        >
                            <lightning-icon icon-name="utility:clear" size="x-small" class="slds-button__icon slds-button__icon_left reset-cta-icon"></lightning-icon>
                            <span>Reset All Filters</span>
                        </button>
                    </div>
                </template>
            </template>
        </div>
    </article>
</template>
