<template>
    <div class="workspace-root slds-p-around_x-small">
        <!-- SLDS Enterprise Portfolio Page Header (Mobile-First Responsive) -->
        <div class="slds-page-header slds-m-bottom_small slds-box slds-theme_default">
            <div class="header-flex">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:orders"
                            size="medium"
                            alternative-text="B2B Order Console"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body header-title-body">
                        <h1 class="slds-page-header__title workspace-title" title="B2B Order &amp; Inventory Console">
                            B2B Order &amp; Inventory Console
                        </h1>
                        <p class="slds-page-header__name-meta slds-m-top_xx-small workspace-subtitle">
                            Salesforce DX Enterprise Architecture &bull; Selector / Domain / Service &bull; Named Credential REST &bull; Platform Events
                        </p>
                    </div>
                </div>
                <div class="badge-strip slds-m-top_x-small">
                    <lightning-badge
                        label="Apex Enterprise Patterns"
                        icon-name="utility:apex"
                        class="slds-badge_lightest"
                    ></lightning-badge>
                    <lightning-badge
                        label="Named Credential REST"
                        icon-name="utility:connected_apps"
                        class="slds-badge_lightest"
                    ></lightning-badge>
                    <lightning-badge
                        label="Platform Events + LMS"
                        icon-name="utility:broadcast"
                        class="slds-badge_lightest"
                    ></lightning-badge>
                </div>
            </div>
        </div>

        <!-- MOBILE & TABLET NAVIGATION SWITCHER (< 1024px): Active Tab Shows Text, Inactive Tabs Show Icon Only -->
        <div class="mobile-switcher-bar slds-m-bottom_small">
            <div class="slds-box slds-box_x-small slds-theme_shade">
                <div class="mobile-nav-row">
                    <span class="slds-text-title_caps slds-text-color_weak mobile-nav-caption">
                        Workspace View
                    </span>
                    <div class="mobile-tab-strip" role="group" aria-label="Mobile Workspace View Switcher">
                        <!-- 1. Catalog Tab -->
                        <template lwc:if={isCatalogTabActive}>
                            <lightning-button
                                label="Catalog"
                                icon-name="utility:product"
                                variant="brand"
                                data-tab="catalog"
                                onclick={handleMobileTabChange}
                            ></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button-icon
                                icon-name="utility:product"
                                variant="border-filled"
                                alternative-text="Catalog"
                                title="Catalog"
                                data-tab="catalog"
                                onclick={handleMobileTabChange}
                            ></lightning-button-icon>
                        </template>

                        <!-- 2. Order Cart Tab -->
                        <template lwc:if={isCartTabActive}>
                            <lightning-button
                                label={cartTabLabel}
                                icon-name="utility:cart"
                                variant="brand"
                                data-tab="cart"
                                onclick={handleMobileTabChange}
                            ></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button-icon
                                icon-name="utility:cart"
                                variant="border-filled"
                                alternative-text={cartTabLabel}
                                title={cartTabLabel}
                                data-tab="cart"
                                onclick={handleMobileTabChange}
                            ></lightning-button-icon>
                        </template>

                        <!-- 3. Orders Fulfillment Tab -->
                        <template lwc:if={isOrdersTabActive}>
                            <lightning-button
                                label="Orders"
                                icon-name="utility:fulfillment_order"
                                variant="brand"
                                data-tab="orders"
                                onclick={handleMobileTabChange}
                            ></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button-icon
                                icon-name="utility:fulfillment_order"
                                variant="border-filled"
                                alternative-text="Orders"
                                title="Orders"
                                data-tab="orders"
                                onclick={handleMobileTabChange}
                            ></lightning-button-icon>
                        </template>

                        <!-- 4. All Stacked Tab -->
                        <template lwc:if={isAllTabActive}>
                            <lightning-button
                                label="All"
                                icon-name="utility:layout"
                                variant="brand"
                                data-tab="all"
                                onclick={handleMobileTabChange}
                            ></lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button-icon
                                icon-name="utility:layout"
                                variant="border-filled"
                                alternative-text="All Views"
                                title="All Views"
                                data-tab="all"
                                onclick={handleMobileTabChange}
                            ></lightning-button-icon>
                        </template>
                    </div>
                </div>

                <!-- Mobile Quick-Jump Banner when item is added to cart while on Catalog tab -->
                <template lwc:if={showMobileCartPrompt}>
                    <div class="slds-box slds-box_xx-small slds-theme_info slds-m-top_x-small mobile-cart-banner">
                        <span class="slds-text-body_small">
                            <strong>{mobileCartCount} SKU(s)</strong> in Cart
                        </span>
                        <lightning-button
                            label="Open Cart"
                            variant="neutral"
                            data-tab="cart"
                            onclick={handleMobileTabChange}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </div>

        <!-- Main Responsive 2-Column Workspace Grid (Always Mounted to Preserve LMS State) -->
        <div class="workspace-grid">
            <!-- Left Column: Warehouse Inventory Catalog -->
            <div class={catalogColumnClass}>
                <c-b2b-inventory-catalog></c-b2b-inventory-catalog>
            </div>

            <!-- Right Column: Interactive Order Builder + Real-Time Fulfillment Monitor -->
            <div class={rightColumnClass}>
                <div class={builderWrapperClass}>
                    <c-b2b-order-builder></c-b2b-order-builder>
                </div>
                <div class={trackerWrapperClass}>
                    <c-b2b-order-tracker></c-b2b-order-tracker>
                </div>
            </div>
        </div>
    </div>
</template>
