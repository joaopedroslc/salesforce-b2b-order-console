<template>
    <div class="workspace-root slds-p-around_x-small">
        <div class="slds-page-header slds-m-bottom_small slds-box slds-theme_default">
            <div class="header-flex">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:orders"
                            size="medium"
                            alternative-text="B2B Order Console"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body header-title-body">
                        <h1 class="slds-page-header__title workspace-title" title="B2B Order &amp; Inventory Console">
                            B2B Order &amp; Inventory Console
                        </h1>
                        <p class="slds-page-header__name-meta slds-m-top_xx-small workspace-subtitle">
                            Salesforce DX Enterprise Architecture &bull; Selector / Domain / Service &bull; Named Credential REST &bull; Platform Events
                        </p>
                    </div>
                </div>
                <div class="badge-strip slds-m-top_x-small">
                    <lightning-badge
                        label="Apex Enterprise Patterns"
                        icon-name="utility:apex"
                        class="slds-badge_lightest"
                    ></lightning-badge>
                    <lightning-badge
                        label="Named Credential REST"
                        icon-name="utility:connected_apps"
                        class="slds-badge_lightest"
                    ></lightning-badge>
                    <lightning-badge
                        label="Platform Events + LMS"
                        icon-name="utility:broadcast"
                        class="slds-badge_lightest"
                    ></lightning-badge>
                </div>
            </div>
        </div>

        <div class="mobile-switcher-bar slds-m-bottom_small">
            <div class="slds-box slds-box_x-small slds-theme_shade">
                <div class="mobile-tab-strip" role="group" aria-label="Workspace View Switcher">
                    <template lwc:if={isCatalogTabActive}>
                        <button
                            type="button"
                            class="slds-button slds-button_brand mobile-tab-btn mobile-tab-btn_active"
                            data-tab="catalog"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon
                                icon-name="utility:product"
                                size="x-small"
                                variant="inverse"
                                class="slds-button__icon slds-button__icon_left"
                            ></lightning-icon>
                            <span>Catalog</span>
                        </button>
                    </template>
                    <template lwc:else>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral mobile-tab-btn"
                            title="Catalog"
                            aria-label="Catalog"
                            data-tab="catalog"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon icon-name="utility:product" size="x-small"></lightning-icon>
                        </button>
                    </template>

                    <template lwc:if={isCartTabActive}>
                        <button
                            type="button"
                            class="slds-button slds-button_brand mobile-tab-btn mobile-tab-btn_active"
                            data-tab="cart"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon
                                icon-name="utility:cart"
                                size="x-small"
                                variant="inverse"
                                class="slds-button__icon slds-button__icon_left"
                            ></lightning-icon>
                            <span>{cartTabLabel}</span>
                        </button>
                    </template>
                    <template lwc:else>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral mobile-tab-btn"
                            title={cartTabLabel}
                            aria-label={cartTabLabel}
                            data-tab="cart"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon icon-name="utility:cart" size="x-small"></lightning-icon>
                        </button>
                    </template>

                    <template lwc:if={isOrdersTabActive}>
                        <button
                            type="button"
                            class="slds-button slds-button_brand mobile-tab-btn mobile-tab-btn_active"
                            data-tab="orders"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon
                                icon-name="utility:fulfillment_order"
                                size="x-small"
                                variant="inverse"
                                class="slds-button__icon slds-button__icon_left"
                            ></lightning-icon>
                            <span>Orders</span>
                        </button>
                    </template>
                    <template lwc:else>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral mobile-tab-btn"
                            title="Orders"
                            aria-label="Orders"
                            data-tab="orders"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon icon-name="utility:fulfillment_order" size="x-small"></lightning-icon>
                        </button>
                    </template>

                    <template lwc:if={isAllTabActive}>
                        <button
                            type="button"
                            class="slds-button slds-button_brand mobile-tab-btn mobile-tab-btn_active"
                            data-tab="all"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon
                                icon-name="utility:layout"
                                size="x-small"
                                variant="inverse"
                                class="slds-button__icon slds-button__icon_left"
                            ></lightning-icon>
                            <span>All</span>
                        </button>
                    </template>
                    <template lwc:else>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral mobile-tab-btn"
                            title="All Views"
                            aria-label="All Views"
                            data-tab="all"
                            onclick={handleMobileTabChange}
                        >
                            <lightning-icon icon-name="utility:layout" size="x-small"></lightning-icon>
                        </button>
                    </template>
                </div>

                <template lwc:if={showMobileCartPrompt}>
                    <div class="slds-box slds-box_xx-small slds-theme_info slds-m-top_x-small mobile-cart-banner">
                        <span class="slds-text-body_small">
                            <strong>{mobileCartCount} SKU(s)</strong> in Cart
                        </span>
                        <lightning-button
                            label="Open Cart"
                            variant="neutral"
                            data-tab="cart"
                            onclick={handleMobileTabChange}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </div>

        <div class="workspace-grid">
            <div class={catalogColumnClass}>
                <c-b2b-inventory-catalog></c-b2b-inventory-catalog>
            </div>

            <div class={rightColumnClass}>
                <div class={builderWrapperClass}>
                    <c-b2b-order-builder></c-b2b-order-builder>
                </div>
                <div class={trackerWrapperClass}>
                    <c-b2b-order-tracker></c-b2b-order-tracker>
                </div>
            </div>
        </div>
    </div>
</template>
