<template>
    <div class="workspace-root slds-p-around_x-small">
        <div class="slds-page-header slds-m-bottom_small slds-box slds-theme_default">
            <div class="header-flex">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:orders"
                            size="medium"
                            alternative-text="B2B Order Console"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body header-title-body">
                        <h1 class="slds-page-header__title workspace-title" title="B2B Order &amp; Inventory Console">
                            B2B Order &amp; Inventory Console
                        </h1>
                        <p class="slds-page-header__name-meta slds-m-top_xx-small workspace-subtitle">
                            Salesforce DX Enterprise Architecture &bull; Selector / Domain / Service &bull; Named Credential REST &bull; Platform Events
                        </p>
                    </div>
                </div>
                <div class="badge-strip slds-m-top_x-small">
                    <span class="slds-badge slds-theme_success header-tag-badge erp-online-badge">
                        <lightning-icon
                            icon-name="utility:connected_apps"
                            size="xx-small"
                            class="slds-m-right_xx-small header-tag-icon erp-online-icon"
                        ></lightning-icon>
                        <span>ERP Live</span>
                    </span>
                    <span class="slds-badge slds-badge_lightest header-tag-badge">
                        <lightning-icon
                            icon-name="utility:apex"
                            size="xx-small"
                            class="slds-m-right_xx-small header-tag-icon"
                        ></lightning-icon>
                        <span>Apex Enterprise Patterns</span>
                    </span>
                    <span class="slds-badge slds-badge_lightest header-tag-badge">
                        <lightning-icon
                            icon-name="utility:broadcast"
                            size="xx-small"
                            class="slds-m-right_xx-small header-tag-icon"
                        ></lightning-icon>
                        <span>Platform Events + LMS</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="mobile-switcher-bar slds-m-bottom_small">
            <div class="slds-box slds-box_x-small slds-theme_shade">
                <div class="mobile-tab-strip" role="group" aria-label="Workspace View Switcher">
                    <button
                        type="button"
                        class={catalogTabClass}
                        title="Catalog"
                        aria-label="Catalog"
                        data-tab="catalog"
                        onclick={handleMobileTabChange}
                    >
                        <lightning-icon
                            icon-name="utility:product"
                            size="x-small"
                            class="mobile-tab-icon"
                        ></lightning-icon>
                        <span class="mobile-tab-label">Catalog</span>
                    </button>

                    <button
                        type="button"
                        class={cartTabClass}
                        title={cartTabLabel}
                        aria-label={cartTabLabel}
                        data-tab="cart"
                        onclick={handleMobileTabChange}
                    >
                        <lightning-icon
                            icon-name="utility:cart"
                            size="x-small"
                            class="mobile-tab-icon"
                        ></lightning-icon>
                        <span class="mobile-tab-label">{cartTabLabel}</span>
                    </button>

                    <button
                        type="button"
                        class={ordersTabClass}
                        title="Orders"
                        aria-label="Orders"
                        data-tab="orders"
                        onclick={handleMobileTabChange}
                    >
                        <lightning-icon
                            icon-name="utility:fulfillment_order"
                            size="x-small"
                            class="mobile-tab-icon"
                        ></lightning-icon>
                        <span class="mobile-tab-label">Orders</span>
                    </button>

                    <button
                        type="button"
                        class={allTabClass}
                        title="All Views"
                        aria-label="All Views"
                        data-tab="all"
                        onclick={handleMobileTabChange}
                    >
                        <lightning-icon
                            icon-name="utility:layout"
                            size="x-small"
                            class="mobile-tab-icon"
                        ></lightning-icon>
                        <span class="mobile-tab-label">All</span>
                    </button>
                </div>

                <template lwc:if={showMobileCartPrompt}>
                    <div class="slds-box slds-box_xx-small slds-theme_info slds-m-top_x-small mobile-cart-banner">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="utility:cart" size="x-small" variant="inverse"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <span class="slds-text-body_small">
                                    <strong>{mobileCartCount} SKU(s)</strong> added to active order
                                </span>
                            </div>
                        </div>
                        <button
                            type="button"
                            class="slds-button slds-button_neutral cart-banner-btn"
                            data-tab="cart"
                            onclick={handleMobileTabChange}
                        >
                            View Cart
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <div class="workspace-grid">
            <div class={catalogColumnClass}>
                <c-b2b-inventory-catalog></c-b2b-inventory-catalog>
            </div>

            <div class={rightColumnClass}>
                <div class={builderWrapperClass}>
                    <c-b2b-order-builder></c-b2b-order-builder>
                </div>
                <div class={trackerWrapperClass}>
                    <c-b2b-order-tracker></c-b2b-order-tracker>
                </div>
            </div>
        </div>
    </div>
</template>
